name: Writing Style

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Release Please opens its pull request with GITHUB_TOKEN, which does
  # not start pull_request workflows. Close and reopen still runs this
  # check. workflow_dispatch runs it on a selected branch.
  workflow_dispatch:

# Dogfoods the repo's own GitHub Action (./action) against its Markdown docs.
# This doubles as an end-to-end test of the action on every push/PR.
#
# The docs are currently clean (0 warnings), so this gates at zero
# (max-warnings: 0): any NEW writing issue fails the job and must be fixed,
# suppressed via .wscrc.json (ignore / word-list remove), or acknowledged.
# Detector tuning and the ignore list for internal docs live in .wscrc.json.
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check writing style in docs
        uses: ./
        with:
          files: "**/*.md"
          max-warnings: "0"
