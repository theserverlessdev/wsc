name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity (commits, issues, or pull requests). Workflow
# runs do not count, and enabling a workflow through the API does not reset
# that clock.
#
# This workflow has no schedule, so GitHub never disables it. Each push to
# master enables Health Check again. This restores Health Check after GitHub
# disables it. It does not prevent the disable.
#
# gh workflow enable fails when the workflow is already enabled, and gh has
# no repository context here because this job does not check out the repo.
# The REST enable endpoint is safe to repeat.

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  actions: write

jobs:
  keep-enabled:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Health Check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/${GH_REPO}/actions/workflows/health.yml/enable"
