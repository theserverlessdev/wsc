name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity (commits, issues, or pull requests). Workflow
# runs do not count. This workflow:
#   1. Re-enables Health Check (and itself) on every master push, on a
#      weekly schedule, and on workflow_dispatch.
#   2. Once a week, adds an empty commit on the keepalive branch so the
#      repository still has activity during quiet periods.
#
# A disabled workflow does not run, so this cannot revive itself.
# If Health Check is still disabled after this file merges, run:
#   gh workflow enable "Health Check"

on:
  schedule:
    # Monday 08:17 UTC, off the top of the hour.
    - cron: "17 8 * * 1"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  actions: write
  contents: write

jobs:
  keep-enabled:
    runs-on: ubuntu-latest
    steps:
      - name: Enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable "Health Check"
          gh workflow enable "Keepalive"

      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 1

      - name: Record repository activity
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin keepalive || true
          if git show-ref --verify --quiet refs/remotes/origin/keepalive; then
            git checkout -B keepalive origin/keepalive
            git commit --allow-empty -m "chore: keep scheduled workflows enabled"
            git push origin keepalive
          else
            git checkout --orphan keepalive
            git reset
            git commit --allow-empty -m "chore: keep scheduled workflows enabled"
            git push origin keepalive
          fi
